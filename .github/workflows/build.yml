name: Build Library

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    env:
      QT_VERSION: 6.8.0
      QT_MODULES: qtbase

    steps:
      - uses: actions/checkout@v4

      # -----------------------
      # Set up Python (needed for aqtinstall)
      # -----------------------
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install aqtinstall
        run: pip install aqtinstall

      # -----------------------
      # Set Qt host and arch
      # -----------------------
      - name: Set Qt host and arch
        id: qt-vars
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            echo "host=windows" >> $GITHUB_OUTPUT
            echo "arch=win64_msvc2022_64" >> $GITHUB_OUTPUT
          elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            echo "host=linux" >> $GITHUB_OUTPUT
            echo "arch=gcc_64" >> $GITHUB_OUTPUT
          else
            echo "host=mac" >> $GITHUB_OUTPUT
            echo "arch=clang_64" >> $GITHUB_OUTPUT
          fi

      # -----------------------
      # Install Qt via aqtinstall
      # -----------------------
      - name: Install Qt
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            OUTPUT_DIR=C:/Qt
          else
            OUTPUT_DIR=$HOME/Qt
          fi

          python -m aqt install-qt \
            ${{ steps.qt-vars.outputs.host }} \
            desktop \
            ${{ env.QT_VERSION }} \
            ${{ steps.qt-vars.outputs.arch }} \
            --outputdir $OUTPUT_DIR \
            --modules ${{ env.QT_MODULES }} \
            --verbose

      # -----------------------
      # Add Qt bin to PATH
      # -----------------------
      - name: Add Qt to PATH
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            QT_BIN=C:/Qt/${{ env.QT_VERSION }}/msvc_64/bin
            echo "$QT_BIN" >> $GITHUB_PATH
          else
            QT_BIN=$HOME/Qt/${{ env.QT_VERSION }}/gcc_64/bin
            if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
              QT_BIN=$HOME/Qt/${{ env.QT_VERSION }}/clang_64/bin
            fi
            echo "$QT_BIN" >> $GITHUB_PATH
          fi

      - name: Display Qt version
        run: qmake --version

      # -----------------------
      # Install OpenCV
      # -----------------------
      - name: Install OpenCV (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libopencv-dev build-essential

      - name: Install OpenCV (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install opencv

      - name: Install OpenCV (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install opencv --version=4.5.5

      # -----------------------
      # Build Linux / macOS
      # -----------------------
      - name: Build (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          # Release
          qmake CONFIG+=release
          make -j$(nproc)
          mkdir -p build/release
          cp librobot.so build/release/

          # Debug
          qmake CONFIG+=debug
          make -j$(nproc)
          mkdir -p build/debug
          cp librobot.so build/debug/librobot_d.so

      # -----------------------
      # Build Windows MSVC 2022
      # -----------------------
      - name: Setup MSVC 2022 environment
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vs-version: '17.0'

      - name: Build (Windows MSVC)
        if: matrix.os == 'windows-latest'
        run: |
          # Release
          qmake -spec win32-msvc CONFIG+=release
          nmake
          mkdir build\release
          copy /y robotlib.dll build\release\

          # Debug
          qmake -spec win32-msvc CONFIG+=debug
          nmake
          mkdir build\debug
          copy /y robotlib.dll build\debug\robotlib_d.dll

      # -----------------------
      # Upload Artifacts
      # -----------------------
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: robotlib-${{ matrix.os }}
          path: |
            build/release/*
            build/debug/*
