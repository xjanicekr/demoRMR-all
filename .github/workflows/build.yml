name: Build Library

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    env:
      QT_VERSION: 6.8.0

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # -----------------------
      # Install Qt (Standardized)
      # -----------------------
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          # Automatically selects the right host/arch based on the runner
          host: ${{ matrix.os == 'windows-latest' && 'windows' || (matrix.os == 'macos-latest' && 'mac' || 'linux') }}
          arch: ${{ matrix.os == 'windows-latest' && 'win64_msvc2022_64' || '' }}
          # This action automatically adds Qt to PATH

      - name: Display Qt version
        run: qmake --version

      # -----------------------
      # Install OpenCV
      # -----------------------
      - name: Install OpenCV (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopencv-dev

      - name: Install OpenCV (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install opencv

      - name: Install OpenCV (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install opencv --version=4.5.5

      # -----------------------
      # Build Linux / macOS
      # -----------------------
      - name: Build (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cd librobot
          
          # Release build
          qmake CONFIG+=release
          make -j$(nproc)
          
          # Debug build
          qmake CONFIG+=debug
          make -j$(nproc)
          
          # Move artifacts to a predictable location for upload
          mkdir -p ../artifacts/release
          mkdir -p ../artifacts/debug
          find . -name "liblibrobot.so*" -exec cp {} ../artifacts/release/ \; || true
          find . -name "liblibrobot.dylib*" -exec cp {} ../artifacts/release/ \; || true

      # -----------------------
      # Build Windows MSVC 2022
      # -----------------------
      - name: Setup MSVC 2022 environment
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build (Windows MSVC)
        if: matrix.os == 'windows-latest'
        shell: cmd
        env:
          # Chocolatey installs OpenCV here; qmake needs to know where to find headers/libs
          OpenCV_DIR: C:\tools\opencv\build
        run: |
          cd librobot
          
          :: Release
          qmake CONFIG+=release
          nmake
          if not exist "..\artifacts\release" mkdir "..\artifacts\release"
          copy /y robotlib.dll ..\artifacts\release\

          :: Debug
          qmake CONFIG+=debug
          nmake
          if not exist "..\artifacts\debug" mkdir "..\artifacts\debug"
          copy /y robotlib.dll ..\artifacts\debug\robotlib_d.dll

      # -----------------------
      # Upload Artifacts
      # -----------------------
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: robotlib-${{ matrix.os }}
          path: artifacts/