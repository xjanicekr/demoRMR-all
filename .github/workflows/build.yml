name: Build Library

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    env:
      QT_VERSION: 6.8.0

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # -----------------------
      # Install Qt
      # -----------------------
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.os == 'windows-latest' && 'windows' || (matrix.os == 'macos-latest' && 'mac' || 'linux') }}
          arch: ${{ matrix.os == 'windows-latest' && 'win64_msvc2022_64' || '' }}

      - name: Display Qt version
        run: qmake --version

      # -----------------------
      # Install OpenCV
      # -----------------------
      - name: Install OpenCV (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopencv-dev

      - name: Install OpenCV (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install opencv

      - name: Install OpenCV (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install opencv --version=4.5.5

      # -----------------------
      # Build Linux / macOS
      # -----------------------
      - name: Build (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cd librobot
          
          # Release build
          qmake CONFIG+=release
          make -j$(nproc)
          
          # Debug build
          qmake CONFIG+=debug
          make -j$(nproc)
          
          # Prepare artifact directory
          mkdir -p ../artifacts/release
          mkdir -p ../artifacts/debug
          
          # Use find to grab the .so or .dylib regardless of exact versioning
          find .. -name "liblibrobot.so*" -exec cp {} ../artifacts/release/ \; || true
          find .. -name "liblibrobot.dylib*" -exec cp {} ../artifacts/release/ \; || true

      # -----------------------
      # Build Windows MSVC 2022
      # -----------------------
      - name: Setup MSVC 2022 environment
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build (Windows MSVC)
        if: matrix.os == 'windows-latest'
        shell: cmd
        env:
          OpenCV_DIR: C:\tools\opencv\build
        run: |
          cd librobot
          
          :: --- Release Build ---
          qmake CONFIG+=release
          nmake
          if not exist "..\artifacts\release" mkdir "..\artifacts\release"
          :: Note: Based on your log, the file is in ..\bin\ and named librobot.dll
          copy /y "..\bin\librobot.dll" "..\artifacts\release\"
          copy /y "..\bin\librobot.lib" "..\artifacts\release\"

          :: --- Debug Build ---
          :: We clean to ensure we don't mix release/debug object files
          nmake clean
          qmake CONFIG+=debug
          nmake
          if not exist "..\artifacts\debug" mkdir "..\artifacts\debug"
          copy /y "..\bin\librobot.dll" "..\artifacts\debug\librobot_d.dll"
          copy /y "..\bin\librobot.lib" "..\artifacts\debug\librobot_d.lib"

      # -----------------------
      # Upload Artifacts
      # -----------------------
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: robotlib-${{ matrix.os }}
          path: artifacts/