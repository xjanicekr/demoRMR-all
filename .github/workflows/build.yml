name: Build Library

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    env:
      QT_VERSION: 6.8.0

    steps:
      - uses: actions/checkout@v4

      # -----------------------
      # Set up Python (for aqtinstall on Windows)
      # -----------------------
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # -----------------------
      # Install Qt
      # -----------------------
      - name: Install Qt
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            pip install aqtinstall
            OUTPUT_DIR=C:/Qt
            ARCH=win64_msvc2022_64
            HOST=windows
            MODULES="qtbase"
            python -m aqt install-qt $HOST desktop ${{ env.QT_VERSION }} $ARCH --outputdir $OUTPUT_DIR --modules $MODULES
          elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get update
            sudo apt-get install -y qt6-base-dev build-essential
          else
            brew update
            brew install qt
          fi

      # -----------------------
      # Add Qt to PATH
      # -----------------------
      - name: Add Qt to PATH
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            echo "C:/Qt/${{ env.QT_VERSION }}/msvc_64/bin" >> $GITHUB_PATH
          elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            echo "/usr/lib/$(ls /usr/lib | grep qt6)/bin" >> $GITHUB_PATH
          else
            echo "/usr/local/opt/qt/bin" >> $GITHUB_PATH
          fi

      - name: Display Qt version
        run: qmake --version

      # -----------------------
      # Install OpenCV
      # -----------------------
      - name: Install OpenCV (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y libopencv-dev

      - name: Install OpenCV (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install opencv

      - name: Install OpenCV (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install opencv --version=4.5.5

      # -----------------------
      # Build Linux / macOS
      # -----------------------
      - name: Build (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cd librobot

          # Release build
          qmake CONFIG+=release
          make -j$(nproc)
          SO_FILE=$(find . -name "liblibrobot.so*" | head -n1)
          mkdir -p ../build/release
          cp $SO_FILE ../build/release/

          # Debug build
          qmake CONFIG+=debug
          make -j$(nproc)
          SO_FILE=$(find . -name "liblibrobot.so*" | head -n1)
          mkdir -p ../build/debug
          cp $SO_FILE ../build/debug/

      # -----------------------
      # Build Windows MSVC 2022
      # -----------------------
      - name: Setup MSVC 2022 environment
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vs-version: '17.0'

      - name: Build (Windows MSVC)
        if: matrix.os == 'windows-latest'
        run: |
          cd librobot

          # Release
          qmake -spec win32-msvc CONFIG+=release
          nmake
          mkdir build\release
          copy /y robotlib.dll build\release\

          # Debug
          qmake -spec win32-msvc CONFIG+=debug
          nmake
          mkdir build\debug
          copy /y robotlib.dll build\debug\robotlib_d.dll

      # -----------------------
      # Upload Artifacts
      # -----------------------
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: robotlib-${{ matrix.os }}
          path: |
            build/release/*
            build/debug/*
