name: Build Library

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    env:
      QT_VERSION: 6.8.0

    steps:
      - uses: actions/checkout@v4

      # -----------------------
      # Install Qt
      # -----------------------
      - name: Install Qt
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            python -m pip install --upgrade pip
            pip install aqtinstall
            OUTPUT_DIR=C:/Qt
            # Install base Qt only (qtbase included by default)
            python -m aqt install-qt windows desktop ${{ env.QT_VERSION }} win64_msvc2022_64 --outputdir $OUTPUT_DIR
          elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get update
            sudo apt-get install -y qt6-base-dev qt6-base-dev-tools build-essential
          else
            brew update
            brew install qt@6
          fi

      # -----------------------
      # Add Qt bin to PATH
      # -----------------------
      - name: Add Qt to PATH
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            QT_BIN=C:/Qt/${{ env.QT_VERSION }}/msvc_64/bin
            echo "$QT_BIN" >> $GITHUB_PATH
          elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            QT_BIN=/usr/lib/$(ls /usr/lib | grep qt6)/bin
            echo "$QT_BIN" >> $GITHUB_PATH
          else
            QT_BIN=/usr/local/opt/qt@6/bin
            echo "$QT_BIN" >> $GITHUB_PATH
          fi

      - name: Display Qt version
        run: qmake --version

      # -----------------------
      # Install OpenCV
      # -----------------------
      - name: Install OpenCV (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y libopencv-dev build-essential

      - name: Install OpenCV (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install opencv

      - name: Install OpenCV (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install opencv --version=4.5.5

      # -----------------------
      # Build Linux / macOS
      # -----------------------
      - name: Build (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          # Release
          qmake CONFIG+=release
          make -j$(nproc)
          mkdir -p build/release
          cp liblibrobot.so build/release/

          # Debug
          qmake CONFIG+=debug
          make -j$(nproc)
          mkdir -p build/debug
          cp liblibrobot.so build/debug/liblibrobot_d.so

      # -----------------------
      # Build Windows MSVC 2022
      # -----------------------
      - name: Setup MSVC 2022 environment
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vs-version: '17.0'

      - name: Build (Windows MSVC)
        if: matrix.os == 'windows-latest'
        run: |
          # Release
          qmake -spec win32-msvc CONFIG+=release
          nmake
          mkdir build\release
          copy /y robotlib.dll build\release\

          # Debug
          qmake -spec win32-msvc CONFIG+=debug
          nmake
          mkdir build\debug
          copy /y robotlib.dll build\debug\robotlib_d.dll

      # -----------------------
      # Upload Artifacts
      # -----------------------
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: robotlib-${{ matrix.os }}
          path: |
            build/release/*
            build/debug/*
