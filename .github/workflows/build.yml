name: Build Library

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    env:
      QT_VERSION: 6.8.0

    steps:
      - uses: actions/checkout@v4

      # -----------------------
      # Set up Python (for aqtinstall)
      # -----------------------
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install aqtinstall
        run: pip install aqtinstall

      # -----------------------
      # Install Qt using aqtinstall (Windows: qtbase module, Linux/macOS: default)
      # -----------------------
      - name: Install Qt
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            OUTPUT_DIR=C:/Qt
            ARCH=win64_msvc2022_64
            HOST=windows
            MODULES="qtbase"
          elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            OUTPUT_DIR=$HOME/Qt
            ARCH=gcc_64
            HOST=linux
            MODULES=""
          else
            OUTPUT_DIR=$HOME/Qt
            ARCH=clang_64
            HOST=mac
            MODULES=""
          fi

          if [[ -z "$MODULES" ]]; then
            python -m aqt install-qt $HOST desktop ${{ env.QT_VERSION }} $ARCH --outputdir $OUTPUT_DIR
          else
            python -m aqt install-qt $HOST desktop ${{ env.QT_VERSION }} $ARCH --outputdir $OUTPUT_DIR --modules $MODULES
          fi

      # -----------------------
      # Add Qt bin to PATH
      # -----------------------
      - name: Add Qt to PATH
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            QT_BIN=C:/Qt/${{ env.QT_VERSION }}/msvc_64/bin
            echo "$QT_BIN" >> $GITHUB_PATH
          elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            QT_BIN=$HOME/Qt/${{ env.QT_VERSION }}/gcc_64/bin
            echo "$QT_BIN" >> $GITHUB_PATH
          else
            QT_BIN=$HOME/Qt/${{ env.QT_VERSION }}/clang_64/bin
            echo "$QT_BIN" >> $GITHUB_PATH
          fi

      - name: Display Qt version
        run: qmake --version

      # -----------------------
      # Install OpenCV
      # -----------------------
      - name: Install OpenCV (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libopencv-dev build-essential

      - name: Install OpenCV (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install opencv

      - name: Install OpenCV (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install opencv --version=4.5.5

      # -----------------------
      # Build Linux / macOS
      # -----------------------
      - name: Build (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          # Release
          qmake CONFIG+=release
          make -j$(nproc)
          mkdir -p build/release
          cp librobot.so build/release/

          # Debug
          qmake CONFIG+=debug
          make -j$(nproc)
          mkdir -p build/debug
          cp librobot.so build/debug/librobot_d.so

      # -----------------------
      # Build Windows MSVC 2022
      # -----------------------
      - name: Setup MSVC 2022 environment
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vs-version: '17.0'

      - name: Build (Windows MSVC)
        if: matrix.os == 'windows-latest'
        run: |
          # Release
          qmake -spec win32-msvc CONFIG+=release
          nmake
          mkdir build\release
          copy /y robotlib.dll build\release\

          # Debug
          qmake -spec win32-msvc CONFIG+=debug
          nmake
          mkdir build\debug
          copy /y robotlib.dll build\debug\robotlib_d.dll

      # -----------------------
      # Upload Artifacts
      # -----------------------
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: robotlib-${{ matrix.os }}
          path: |
            build/release/*
            build/debug/*
